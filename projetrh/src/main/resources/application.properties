spring.application.name=projetrh
server.port=8080

# Profil actif : "dev" par défaut en local, "prod" en déploiement
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Expose error messages from ResponseStatusException in JSON responses
server.error.include-message=always

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hr_database}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Batch les chargements de relations LAZY en IN(...) pour eviter les N+1
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# Serialize LocalDate/LocalDateTime as ISO strings (not arrays)
spring.jackson.serialization.write-dates-as-timestamps=false

# ── Active Directory SSO ──────────────────────────────────────────
ad.domain=${AD_DOMAIN:EMEAAD}
ad.url=${AD_URL:ldap://emeaad/}

# ── Microservice IA (Flask) ──────────────────────────────────────
ia.service.url=${IA_SERVICE_URL:http://localhost:5001}

# ── JWT ──────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:28800000}

# ── Flyway (baseline sur DB existante) ───────────────────────────
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=38
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
