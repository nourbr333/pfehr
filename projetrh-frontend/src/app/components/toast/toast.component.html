<div class="toast-container" aria-live="polite" aria-relevant="additions">
  <div
    class="toast"
    *ngFor="let t of toasts"
    [ngClass]="t.type"
  >
    <div class="toast-icon" aria-hidden="true">
      <ng-container [ngSwitch]="t.type">
        <svg *ngSwitchCase="'success'" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M20 6 9 17l-5-5" />
        </svg>
        <svg *ngSwitchCase="'error'" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M18 6 6 18" />
          <path d="M6 6l12 12" />
        </svg>
        <svg *ngSwitchCase="'info'" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" />
          <path d="M12 16v-4" />
          <path d="M12 8h.01" />
        </svg>
        <svg *ngSwitchDefault width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
          <path d="M12 9v4" />
          <path d="M12 17h.01" />
        </svg>
      </ng-container>
    </div>
    <div class="toast-message">{{ t.message }}</div>
    <button type="button" class="toast-close" (click)="dismiss(t.id)" aria-label="Fermer">×</button>
  </div>
</div>
