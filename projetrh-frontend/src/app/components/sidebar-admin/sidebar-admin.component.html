<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <h2>HRScope</h2>
      <p>Portail Admin</p>
    </div>

    <nav class="sidebar-nav">
      <a
        class="nav-item"
        routerLink="/admin/dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <rect x="3" y="3" width="7" height="7" rx="1" />
          <rect x="14" y="3" width="7" height="7" rx="1" />
          <rect x="3" y="14" width="7" height="7" rx="1" />
          <rect x="14" y="14" width="7" height="7" rx="1" />
        </svg>
        Tableau de bord
      </a>

      <a class="nav-item" routerLink="/admin/vue-responsables" routerLinkActive="active">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
        </svg>
        Vue Responsables
      </a>

      <a class="nav-item" routerLink="/admin/vue-managers" routerLinkActive="active">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <rect x="2" y="7" width="20" height="14" rx="2" />
          <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2" />
        </svg>
        Vue Managers
      </a>

      <a class="nav-item" routerLink="/admin/utilisateurs" routerLinkActive="active">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" />
        </svg>
        Utilisateurs
      </a>

      <a class="nav-item" routerLink="/admin/logs" routerLinkActive="active">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M3 12h18" />
          <path d="M7 12l-2 2 2 2" />
          <path d="M17 12l2-2-2-2" />
          <path d="M14 6h7v12h-7" />
          <path d="M3 6h7v12H3z" />
        </svg>
        Activités
      </a>

      <a class="nav-item" routerLink="/calendrier" routerLinkActive="active">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="18" rx="2" />
          <line x1="16" y1="2" x2="16" y2="6" />
          <line x1="8" y1="2" x2="8" y2="6" />
          <line x1="3" y1="10" x2="21" y2="10" />
        </svg>
        Calendrier
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="nav-logout" (click)="onDeconnexion()">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
        Déconnexion
      </div>
    </div>
  </aside>

  <div class="main-wrapper">
    <header class="topbar">
      <div class="topbar-left"></div>

      <div class="topbar-actions">
        <app-notifications-panel></app-notifications-panel>

        <div class="user-info">
          <div class="user-info-text">
            <div class="name">{{ utilisateur?.prenom }} {{ utilisateur?.nom }}</div>
            <div class="role">{{ roleLabel }}</div>
          </div>
          <div class="avatar" (click)="onProfil()" title="Mon profil">{{ avatarText }}</div>
        </div>
      </div>
    </header>

    <main class="page-content">
      <ng-content></ng-content>
    </main>
  </div>

  <app-toast></app-toast>
</div>
