<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-brand"><h2>HRScope</h2><p>Portail Manager</p></div>
    <nav class="sidebar-nav">
      <a class="nav-item" routerLink="/accueil-manager" routerLinkActive="active">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>Tableau de bord
      </a>
      <a class="nav-item" routerLink="/manager/equipe" routerLinkActive="active">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M17 21v-2a4 4 0 0 0-3-3.8A4 4 0 0 0 9 13H7a4 4 0 0 0-3.9 3.2L3 19v2"/>
          <circle cx="9" cy="7" r="3.5"/>
          <path d="M21 21v-2a4 4 0 0 0-3-3.8"/><circle cx="18" cy="8" r="3"/>
        </svg>Mon Équipe
      </a>
      <a class="nav-item" routerLink="/manager/absences-avancees" routerLinkActive="active">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M8 2v4"/><path d="M16 2v4"/><rect x="3" y="4" width="18" height="18" rx="2"/>
          <path d="M3 10h18"/><path d="M9 15l2 2 4-4"/>
        </svg>Absences avancé
      </a>
      <a class="nav-item" routerLink="/manager/okr" routerLinkActive="active">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"/>
          <circle cx="12" cy="12" r="6"/>
          <circle cx="12" cy="12" r="2"/>
          <line x1="12" y1="2" x2="12" y2="6"/>
          <line x1="12" y1="18" x2="12" y2="22"/>
          <line x1="2" y1="12" x2="6" y2="12"/>
          <line x1="18" y1="12" x2="22" y2="12"/>
        </svg>Objectifs
      </a>
      <a class="nav-item" routerLink="/manager/evaluations" routerLinkActive="active">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
          <rect x="9" y="3" width="6" height="4" rx="1"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>Évaluations
      </a>
      <a class="nav-item" routerLink="/manager/rapports" routerLinkActive="active">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M9 17v-6"/><path d="M12 17V7"/><path d="M15 17v-4"/>
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2z"/>
        </svg>Rapports
      </a>

      <a class="nav-item" routerLink="/manager/calendrier" routerLinkActive="active">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
        </svg>Calendrier
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="nav-logout" (click)="onDeconnexion()">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
        </svg>Déconnexion
      </div>
    </div>
  </aside>

  <div class="main-wrapper">
    <header class="topbar">
      <div class="topbar-actions">
        <app-notifications-panel></app-notifications-panel>
        <div class="user-info">
          <div class="user-info-text">
            <div class="name">{{ utilisateur?.prenom }} {{ utilisateur?.nom }}</div>
            <div class="role">{{ utilisateur?.role }}</div>
          </div>
          <div class="avatar" (click)="onProfil()" title="Mon profil">{{ utilisateur?.initiales }}</div>
        </div>
      </div>
    </header>

    <main class="page-content">
      <app-rapport></app-rapport>
    </main>
  </div>
</div>
