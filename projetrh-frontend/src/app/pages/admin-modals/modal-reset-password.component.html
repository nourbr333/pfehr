<div class="modal-backdrop" (click)="generatedPassword ? onClose() : undefined">
  <div class="modal-card sm" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title">
        Réinitialisation — {{ fullNameOf() }}
      </div>
      <button
        *ngIf="generatedPassword"
        type="button"
        class="modal-close"
        (click)="onClose()"
      >
        ✕
      </button>
    </div>

    <div class="modal-body">
      <div class="reset-text">
        Un nouveau mot de passe temporaire sera généré pour {{ fullNameOf() }}.
      </div>

      <div class="actions-row" *ngIf="!generatedPassword">
        <button type="button" class="btn-primary" (click)="generate()">
          Générer
        </button>
      </div>

      <div class="result-box" *ngIf="generatedPassword">
        <div class="result-label">Mot de passe temporaire</div>
        <div class="result-password">{{ generatedPassword }}</div>
        <div class="copy-row">
          <button type="button" class="btn-secondary copy-btn" (click)="copyToClipboard()">
            📋 Copier
          </button>
        </div>
      </div>

      <div class="note">
        Communiquez ce mot de passe à l'utilisateur de manière sécurisée.
      </div>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn-secondary" [disabled]="!generatedPassword" (click)="onClose()">
        Fermer
      </button>
    </div>
  </div>
</div>
